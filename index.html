<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Race Live Schedule & Countdown Dashboard</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0a0a0c;
            color: #ffffff;
            overflow: hidden;
            padding: 20px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        /* Full Screen Button */
        .fullscreen-btn {
            position: fixed; top: 20px; right: 20px; background: rgba(255, 255, 255, 0.1); color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2); padding: 8px 12px; border-radius: 6px;
            cursor: pointer; opacity: 0.2; transition: opacity 0.3s, background 0.3s; z-index: 2000;
            font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px;
        }
        .fullscreen-btn:hover { opacity: 1; background: rgba(255, 255, 255, 0.2); }

        /* Header Styles */
        header {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 3px solid #ffcc00; padding-bottom: 15px; margin-bottom: 20px;
        }
        .logo-title h1 { font-size: 2.5rem; text-transform: uppercase; letter-spacing: 2px; color: #ffffff; }
        .logo-title span { color: #ffcc00; }
        .local-time-container { text-align: right; padding-right: 80px; }
        .time-label { font-size: 0.9rem; text-transform: uppercase; color: #8a8a93; letter-spacing: 1px; }
        .digital-clock {
            font-family: 'Courier New', Courier, monospace; font-size: 3.5rem; font-weight: bold;
            color: #ffcc00; text-shadow: 0 0 10px rgba(255, 204, 0, 0.3); line-height: 1;
        }

        /* TOP MODULES (Ticker & Gate Status) */
        .top-modules {
            display: flex; flex-direction: column; gap: 15px; margin-bottom: 25px;
        }

        /* Ticker Style */
        .ticker-container {
            width: 100%; height: 60px; background-color: #141418; border: 2px solid #2196f3;
            display: flex; align-items: center; overflow: hidden; border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.4);
        }
        .ticker-label {
            background-color: #2196f3; color: #ffffff; font-weight: bold; text-transform: uppercase;
            padding: 0 30px; height: 100%; display: flex; align-items: center; white-space: nowrap;
            z-index: 2; font-size: 1.4rem; letter-spacing: 1.5px; box-shadow: 5px 0 15px rgba(0,0,0,0.7);
        }
        .ticker-content-wrapper { flex: 1; overflow: hidden; display: flex; align-items: center; height: 100%; }
        .ticker-text {
            white-space: nowrap; padding-left: 100%; display: inline-block; font-size: 1.8rem;
            font-weight: 600; color: #ffffff; text-transform: uppercase; animation: ticker-move 25s linear infinite;
        }
        .ticker-text span.highlight-blue { color: #2196f3; font-weight: 800; }
        .ticker-text span.highlight-yellow { color: #ffcc00; font-weight: 800; }
        .ticker-text span.highlight-red { color: #E43138; font-weight: 800; }
        @keyframes ticker-move { 0% { transform: translate3d(0, 0, 0); } 100% { transform: translate3d(-100%, 0, 0); } }

        /* Gate Status Panel */
        .gate-panel {
            display: flex; justify-content: space-between; align-items: center; background-color: #1a1a24;
            border: 2px solid #555; border-radius: 8px; padding: 15px 30px; box-shadow: 0 5px 15px rgba(0,0,0,0.4);
            transition: all 0.3s;
        }
        .gate-title { font-size: 1.6rem; font-weight: 800; color: #ffcc00; text-transform: uppercase; letter-spacing: 1px; }
        .gate-times { font-size: 1.3rem; color: #a0a0ab; margin-left: 20px; }
        .gate-times strong { color: #fff; }
        .gate-timer-box { display: flex; align-items: center; gap: 15px; }
        .gate-status-text { font-size: 1.4rem; font-weight: 700; color: #fff; text-transform: uppercase; }
        .gate-countdown-timer {
            font-family: 'Courier New', Courier, monospace; font-size: 3.5rem; font-weight: 900; color: #a0a0ab; line-height: 1;
        }

        /* Gate Panel Dynamic States */
        .gate-open-solid { border-color: #00e676; }
        .gate-open-solid .gate-countdown-timer { color: #00e676; text-shadow: 0 0 15px rgba(0, 230, 118, 0.4); }
        .gate-closed { border-color: #E43138; opacity: 0.7; }
        .gate-closed .gate-countdown-timer { color: #E43138; }
        
        .gate-flash-red {
            background-color: #E43138 !important; border-color: #ff5258 !important;
            box-shadow: 0 0 30px rgba(229, 49, 56, 0.8) !important;
        }
        .gate-flash-red * { color: #ffffff !important; text-shadow: none !important;}
        
        .gate-flash-fast { animation: gate-fast-flash 0.5s infinite alternate !important; border-color: #ff5258 !important; }
        @keyframes gate-fast-flash {
            from { background-color: #E43138; box-shadow: 0 0 30px rgba(229, 49, 56, 0.9); }
            to { background-color: #1a1a24; box-shadow: none; }
        }

        /* Main Display (Current Session) */
        .main-display { flex: 1; display: flex; flex-direction: column; justify-content: center; }
        .session-card {
            background: linear-gradient(145deg, #111e16, #141418); border-left: 12px solid #00e676;
            border-radius: 12px; padding: 40px; box-shadow: 0 15px 35px rgba(0, 230, 118, 0.15); position: relative;
        }
        .session-status {
            display: inline-block; padding: 6px 16px; border-radius: 4px; font-size: 1rem;
            font-weight: bold; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 20px;
            background-color: #00e676; color: #000;
        }
        .category-name { font-size: 4.5rem; font-weight: 900; color: #ffffff; line-height: 1.1; text-transform: uppercase; letter-spacing: 1px; }
        .activity-name { font-size: 2.8rem; color: #ffcc00; font-weight: 700; margin-top: 10px; text-transform: uppercase; }
        
        .countdown-box {
            margin-top: 35px; background-color: rgba(0, 0, 0, 0.5); padding: 30px; border-radius: 8px;
            display: flex; align-items: center; justify-content: space-between; border: 1px solid #222;
        }
        .countdown-label { font-size: 2rem; text-transform: uppercase; color: #a0a0ab; font-weight: 600; letter-spacing: 1px; }
        .countdown-timer { font-family: 'Courier New', Courier, monospace; font-size: 7.5rem; font-weight: bold; color: #00e676; text-shadow: 0 0 20px rgba(0, 230, 118, 0.4); line-height: 1; }

        .qualifying-warning-box {
            margin-top: 25px; background-color: #E43138; color: #ffffff; padding: 25px; border-radius: 8px;
            font-weight: bold; text-align: center; font-size: 1.8rem; text-transform: uppercase; letter-spacing: 1px;
            box-shadow: 0 0 20px rgba(229, 49, 56, 0.6); animation: pulse-red 1s infinite alternate; display: none;
        }
        @keyframes pulse-red {
            from { background-color: #E43138; box-shadow: 0 0 15px rgba(229, 49, 56, 0.6); }
            to { background-color: #ff5258; box-shadow: 0 0 30px rgba(229, 49, 56, 0.9); }
        }

        .no-session {
            text-align: center; padding: 80px; font-size: 2.5rem; font-weight: bold;
            color: #8a8a93; background-color: #141418; border-radius: 12px; border: 2px dashed #444;
        }
    </style>
</head>
<body>

    <button class="fullscreen-btn" onclick="toggleFullScreen()" id="fs-btn">⛶ Fullscreen</button>

    <div class="container">
        <header>
            <div class="logo-title">
                <h1>RMC Thailand <span>Live Dashboard</span></h1>
            </div>
            <div class="local-time-container">
                <div class="time-label">Local Time</div>
                <div class="digital-clock" id="local-clock">00:00:00</div>
            </div>
        </header>

        <!-- NEW TOP MODULES -->
        <div class="top-modules" id="upcoming-modules-box" style="display: none;">
            
            <!-- Ticker -->
            <div class="ticker-container">
                <div class="ticker-label">NEXT SESSION</div>
                <div class="ticker-content-wrapper">
                    <div class="ticker-text" id="ticker-dynamic-text">Loading...</div>
                </div>
            </div>

            <!-- Service Park Gate Status -->
            <div class="gate-panel" id="gate-panel">
                <div style="display: flex; align-items: center;">
                    <div class="gate-title">SERVICE PARK GATE</div>
                    <div class="gate-times">
                        OPEN: <strong id="gate-time-open">--:--</strong> &nbsp;|&nbsp; 
                        CLOSE: <strong id="gate-time-close">--:--</strong>
                    </div>
                </div>
                <div class="gate-timer-box">
                    <span class="gate-status-text" id="gate-status-text">STATUS</span>
                    <span class="gate-countdown-timer" id="gate-countdown-timer">00:00</span>
                </div>
            </div>
        </div>

        <!-- MAIN ON TRACK MODULE -->
        <main class="main-display">
            <div id="current-session-box" class="session-card">
                <span class="session-status">ON TRACK NOW</span>
                <div class="category-name" id="curr-category">LOADING...</div>
                <div class="activity-name" id="curr-activity">-</div>
                <div class="qualifying-warning-box" id="qualifying-warning">
                    ⚠️ WARNING: Drivers must be on track 2 minutes after Qualifying Practice started!
                </div>
                <div class="countdown-box">
                    <span class="countdown-label">Time Remaining</span>
                    <span class="countdown-timer" id="curr-countdown">00:00</span>
                </div>
            </div>

            <div id="no-session-box" class="no-session" style="display: none;">
                🏁 ALL SESSIONS COMPLETED FOR TODAY
            </div>
        </main>
    </div>

    <script>
        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => { console.log(`Error: ${err.message}`); });
                document.getElementById('fs-btn').textContent = "✖ Exit Fullscreen";
            } else {
                if (document.exitFullscreen) { document.exitFullscreen(); document.getElementById('fs-btn').textContent = "⛶ Fullscreen"; }
            }
        }

        const mockSchedule = [
            { startTime: "08:00", endTime: "08:20", category: "MICRO MAX / MINI MAX", activity: "REGISTRATION" },
            { startTime: "14:00", endTime: "14:20", category: "JUNIOR MAX", activity: "OFFICIAL PRACTICE #1" }
        ];

        let activeSchedule = [...mockSchedule];
        const GATE_NOTE_DEFAULT = "⚠️ NOTE: Start servicing park gate will be OPEN 15 MINS before the start of the categories and will be CLOSE 5 MINS before the start of the categories.";

        window.addEventListener('DOMContentLoaded', () => {
            const savedUrl = localStorage.getItem('google_sheet_csv_url');
            if (savedUrl) fetchLiveSheetData(savedUrl);
            
            window.addEventListener('storage', (e) => {
                if (e.key === 'google_sheet_csv_url') {
                    if (e.newValue) fetchLiveSheetData(e.newValue);
                    else activeSchedule = [...mockSchedule];
                }
            });

            setInterval(updateDashboard, 1000);
            updateDashboard();
        });

        async function fetchLiveSheetData(url) {
            try {
                const response = await fetch(url);
                const dataText = await response.text();
                const lines = dataText.split(/\r?\n/);
                const parsedSessions = [];
                
                for (let i = 0; i < lines.length; i++) {
                    if (!lines[i].trim()) continue;
                    let cols = []; let inQuote = false; let value = '';
                    for (let ch of lines[i]) {
                        if (inQuote) { if (ch === '"') inQuote = false; else value += ch; } 
                        else { if (ch === '"') inQuote = true; else if (ch === ',') { cols.push(value.trim()); value = ''; } else value += ch; }
                    }
                    cols.push(value.trim());

                    if (cols.length >= 5) {
                        let startTime = cols[1]; let endTime = cols[2]; let category = cols[3]; let activity = cols[4];
                        if (startTime && startTime.split(':').length === 3) startTime = startTime.split(':').slice(0, 2).join(':');
                        if (endTime && endTime.split(':').length === 3) endTime = endTime.split(':').slice(0, 2).join(':');

                        if (/^\d{1,2}:\d{2}$/.test(startTime) && /^\d{1,2}:\d{2}$/.test(endTime)) {
                            parsedSessions.push({ startTime, endTime, category, activity });
                        }
                    }
                }
                if (parsedSessions.length > 0) activeSchedule = parsedSessions;
            } catch (e) { console.error("Live fetch failed:", e); }
        }

        function formatTimeFromMinutes(totalMinutes) {
            if (totalMinutes < 0) totalMinutes = 1440 + totalMinutes; // Handle midnight crossing slightly
            let h = Math.floor(totalMinutes / 60) % 24;
            let m = totalMinutes % 60;
            return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
        }

        function updateDashboard() {
            const timeMode = localStorage.getItem('sim_mode') || 'real';
            let currentDisplayDate = new Date();
            
            if (timeMode === 'sim') {
                const simTimeStr = localStorage.getItem('sim_time') || "12:00";
                const [sHours, sMinutes] = simTimeStr.split(':').map(Number);
                currentDisplayDate.setHours(sHours, sMinutes, currentDisplayDate.getSeconds()); 
            }

            const hrs = String(currentDisplayDate.getHours()).padStart(2, '0');
            const mins = String(currentDisplayDate.getMinutes()).padStart(2, '0');
            const secs = String(currentDisplayDate.getSeconds()).padStart(2, '0');
            
            const clockEl = document.getElementById('local-clock');
            clockEl.textContent = `${hrs}:${mins}:${secs}`;
            if (timeMode === 'sim') {
                clockEl.style.color = "#E43138"; clockEl.style.textShadow = "0 0 10px rgba(229, 49, 56, 0.4)";
                document.querySelector('.time-label').textContent = "SIMULATED TIME";
            } else {
                clockEl.style.color = "#ffcc00"; clockEl.style.textShadow = "0 0 10px rgba(255, 204, 0, 0.3)";
                document.querySelector('.time-label').textContent = "Local Time";
            }

            const currentMinutesOfDay = currentDisplayDate.getHours() * 60 + currentDisplayDate.getMinutes();
            const currentSecondsValue = currentMinutesOfDay * 60 + currentDisplayDate.getSeconds();

            let currentSession = null;
            let upcomingSession = null;
            const sortedSchedule = [...activeSchedule].sort((a,b) => timeToMinutes(a.startTime) - timeToMinutes(b.startTime));

            for (let session of sortedSchedule) {
                const startMins = timeToMinutes(session.startTime);
                const endMins = timeToMinutes(session.endTime);

                if (currentMinutesOfDay >= startMins && currentMinutesOfDay < endMins) {
                    currentSession = session;
                } else if (startMins > currentMinutesOfDay && !upcomingSession) {
                    upcomingSession = session;
                }
            }

            // Fallback UI
            if (!currentSession && !upcomingSession) {
                document.getElementById('current-session-box').style.display = 'none';
                document.getElementById('upcoming-modules-box').style.display = 'none';
                document.getElementById('no-session-box').style.display = 'block';
                return;
            }
            document.getElementById('no-session-box').style.display = 'none';

            // --- CURRENT SESSION LOGIC ---
            if (currentSession) {
                document.getElementById('current-session-box').style.display = 'block';
                document.getElementById('curr-category').textContent = currentSession.category;
                document.getElementById('curr-activity').textContent = currentSession.activity;

                const endSecondsTotal = timeToMinutes(currentSession.endTime) * 60;
                document.getElementById('curr-countdown').textContent = formatSecondsToMMSS(endSecondsTotal - currentSecondsValue);

                if (currentSession.activity.trim().toUpperCase() === "QUALIFYING PRACTICE") {
                    const elapsedSeconds = currentSecondsValue - (timeToMinutes(currentSession.startTime) * 60);
                    document.getElementById('qualifying-warning').style.display = (elapsedSeconds >= 0 && elapsedSeconds <= 120) ? 'block' : 'none';
                } else {
                    document.getElementById('qualifying-warning').style.display = 'none';
                }
            } else {
                document.getElementById('current-session-box').style.display = 'block';
                document.getElementById('curr-category').textContent = "TRACK CLEAR";
                document.getElementById('curr-activity').textContent = "WAITING FOR NEXT SESSION";
                document.getElementById('curr-countdown').textContent = "00:00";
                document.getElementById('qualifying-warning').style.display = 'none';
            }

            // --- UPCOMING MODULES (Ticker & Gate Status) ---
            const upcomingBox = document.getElementById('upcoming-modules-box');
            if (upcomingSession) {
                upcomingBox.style.display = 'flex';
                
                const sessionStartMins = timeToMinutes(upcomingSession.startTime);
                const sessionStartSecs = sessionStartMins * 60;
                
                // 1. Ticker Logic (5 Min Cycle: 4 Min Default Note, 1 Min Custom Announcement)
                const customNote = localStorage.getItem('custom_announcement') || "";
                let activeNote = GATE_NOTE_DEFAULT;
                const cycleSec = currentSecondsValue % 300; 
                if (customNote && cycleSec >= 240) {
                    activeNote = `📢 TRACK ANNOUNCEMENT: <span class="highlight-red">${customNote}</span>`;
                }

                const sessionCountdownStr = formatSecondsToMMSS(sessionStartSecs - currentSecondsValue);
                const tickerHtml = `<span class="highlight-blue">${upcomingSession.category}</span> - ${upcomingSession.activity} | STARTS AT: <span class="highlight-yellow">${upcomingSession.startTime}</span> | SESSION IN: <span class="highlight-yellow">${sessionCountdownStr}</span> &nbsp;&nbsp;&nbsp;&nbsp; 🔴 ${activeNote} 🔴 &nbsp;&nbsp;&nbsp;&nbsp;`;
                
                const tickerElem = document.getElementById('ticker-dynamic-text');
                if (tickerElem.dataset.lastContent !== tickerHtml) {
                    tickerElem.innerHTML = tickerHtml;
                    tickerElem.dataset.lastContent = tickerHtml;
                }

                // 2. Gate Logic 
                // Open = 15 mins before, Close = 5 mins before
                const gateOpenMins = sessionStartMins - 15;
                const gateCloseMins = sessionStartMins - 5;
                const gateCloseSecs = gateCloseMins * 60;
                const gateOpenSecs = gateOpenMins * 60;

                document.getElementById('gate-time-open').textContent = formatTimeFromMinutes(gateOpenMins);
                document.getElementById('gate-time-close').textContent = formatTimeFromMinutes(gateCloseMins);

                const secsToGateOpen = gateOpenSecs - currentSecondsValue;
                const secsToGateClose = gateCloseSecs - currentSecondsValue;

                const gatePanel = document.getElementById('gate-panel');
                const gateStatusTxt = document.getElementById('gate-status-text');
                const gateTimerTxt = document.getElementById('gate-countdown-timer');

                let panelClass = "";

                if (secsToGateOpen > 0) {
                    // Not Open Yet
                    gateStatusTxt.textContent = "GATE OPENS IN";
                    gateTimerTxt.textContent = formatSecondsToMMSS(secsToGateOpen);
                    panelClass = ""; // default dark grey
                } else if (secsToGateClose > 0) {
                    // Gate is OPEN, counting down to CLOSE
                    gateStatusTxt.textContent = "GATE OPEN - CLOSES IN";
                    gateTimerTxt.textContent = formatSecondsToMMSS(secsToGateClose);
                    
                    // Flashing Rules (Warning if < 5 mins to close)
                    if (secsToGateClose <= 10) {
                        panelClass = "gate-flash-fast"; // Last 10s continuous blink
                    } else if (secsToGateClose <= 300) {
                        // Flash for 3 seconds every 30 seconds
                        let m30 = secsToGateClose % 30;
                        // secsToGateClose goes 300, 299, 298... 
                        // m30 will be 0, 29, 28... -> Flash when m30 is 0, 29, 28
                        if (m30 === 0 || m30 >= 28) {
                            panelClass = "gate-flash-red";
                        } else {
                            panelClass = "gate-open-solid";
                        }
                    } else {
                        panelClass = "gate-open-solid"; // Just solid green border
                    }
                } else {
                    // Gate Closed
                    gateStatusTxt.textContent = "GATE CLOSED";
                    gateTimerTxt.textContent = "00:00";
                    panelClass = "gate-closed";
                }
                
                gatePanel.className = `gate-panel ${panelClass}`;

            } else {
                upcomingBox.style.display = 'none';
            }
        }

        function timeToMinutes(timeStr) {
            const [hours, minutes] = timeStr.split(':').map(Number);
            return hours * 60 + minutes;
        }

        function formatSecondsToMMSS(totalSeconds) {
            if (totalSeconds < 0) totalSeconds = 0;
            const minutes = Math.floor(totalSeconds / 60);
            const seconds = totalSeconds % 60;
            return `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
        }
    </script>
</body>
</html>
