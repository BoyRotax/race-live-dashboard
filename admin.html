<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Race Dashboard - Staff Admin Panel</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0c0c0e; color: #ffffff; padding: 20px; }
        .top-header { max-width: 1400px; margin: 0 auto 20px auto; display: flex; justify-content: space-between; align-items: center; background: #141418; padding: 15px 25px; border-radius: 8px; border: 1px solid #2e2e38; }
        .top-header h1 { color: #ffcc00; font-size: 1.5rem; text-transform: uppercase; }
        .admin-layout { display: grid; grid-template-columns: 1fr; gap: 20px; max-width: 1400px; margin: 0 auto; }
        @media (min-width: 768px) { .admin-layout { grid-template-columns: 2fr 1fr; } }
        .admin-box { background: #141418; border: 1px solid #2e2e38; border-radius: 8px; padding: 25px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .admin-box h2 { font-size: 1.2rem; margin-bottom: 15px; text-transform: uppercase; border-bottom: 2px solid; padding-bottom: 8px; }
        p { color: #a0a0ab; font-size: 0.9rem; margin-bottom: 15px; line-height: 1.5; }
        .input-group { margin-bottom: 15px; }
        label { display: block; color: #ffcc00; font-size: 0.8rem; font-weight: bold; text-transform: uppercase; margin-bottom: 6px; }
        input[type="text"], textarea { width: 100%; background-color: #0a0a0c; border: 1px solid #444; color: #fff; padding: 10px; border-radius: 4px; font-size: 0.9rem; margin-bottom: 10px; font-family: inherit; }
        .btn { background-color: #ffcc00; color: #000; border: none; padding: 10px 20px; border-radius: 4px; font-weight: bold; cursor: pointer; text-transform: uppercase; width: 100%; font-size: 0.95rem; }
        .btn:hover { background-color: #e6b800; }
        .btn-clear { background-color: #444; color: #fff; margin-top: 5px; }
        .btn-clear:hover { background-color: #E43138; }
        .status-msg { margin-top: 10px; font-weight: bold; font-size: 0.85rem; text-align: center; min-height: 20px; }
        .note-box { border-color: #2196f3; } .note-box h2 { color: #2196f3; border-bottom-color: #2196f3; }
        .history-list { margin-top: 10px; background: #0a0a0c; border: 1px solid #333; border-radius: 4px; max-height: 200px; overflow-y: auto; padding: 10px; }
        .history-item { padding: 10px; border-bottom: 1px dashed #333; font-size: 0.85rem; display: flex; justify-content: space-between; align-items: center; }
        .history-time { color: #2196f3; font-weight: bold; }
        .btn-reuse { background: transparent; padding: 2px 6px; border-radius: 4px; cursor: pointer; font-size: 0.75rem; font-weight: bold; text-transform: uppercase; color: #ffcc00; border: 1px solid #ffcc00; margin-right: 5px; }
        .btn-reuse:hover { background: #ffcc00; color: #000; }
        
        /* Collapsible API Panel */
        .api-panel { background: #0c0c0e; border: 1px dashed #444; border-radius: 6px; margin-top: 30px; overflow: hidden; transition: all 0.3s ease; }
        .api-panel-header { padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; background: #1a1a24; }
        .api-panel-header:hover { background: #22222a; }
        .api-title { font-size: 0.85rem; color: #8a8a93; font-weight: bold; text-transform: uppercase; display: flex; align-items: center; gap: 10px; }
        .api-status-dot { width: 10px; height: 10px; border-radius: 50%; background: #E43138; display: inline-block; }
        .api-status-dot.active { background: #00e676; box-shadow: 0 0 8px rgba(0,230,118,0.5); }
        .api-content { padding: 20px; display: none; }
        .api-content.open { display: block; }
    </style>
</head>
<body>

    <div class="top-header">
        <h1>Race Control Admin</h1>
        <div style="font-size: 0.85rem;">Logged in as: <strong style="color:#00e676;">info@rotax-asia.com</strong></div>
    </div>

    <div class="admin-layout">
        <div class="admin-box note-box">
            <h2>📢 Track Announcement</h2>
            <p>พิมพ์ประกาศเพื่อบันทึกลงชีต <strong>"Announcements"</strong> และส่งไปยังหน้าจอมือถือของทุกคนแบบ Real-time</p>
            <div class="input-group">
                <label>Custom Announcement Note</label>
                <textarea id="custom-note" rows="3" placeholder="พิมพ์ข้อความที่นี่..."></textarea>
                <button class="btn" style="background-color: #2196f3; color: #fff;" onclick="sendAnnouncement()">🚀 Broadcast to Sheet</button>
                <button class="btn btn-clear" onclick="clearAnnouncement()">✖ Stop / Clear Sheet</button>
            </div>
            <div class="status-msg" id="note-status"></div>
            <h3 style="color:#2196f3; font-size:0.9rem; margin-top:20px; border-bottom:1px solid #333; padding-bottom:5px;">History (Local Device)</h3>
            <div class="history-list" id="history-container"></div>
        </div>

        <div>
            <div class="admin-box" style="border-color: #E43138;">
                <h2 style="color: #E43138; border-bottom-color: #E43138;">⚙️ Simulate Time</h2>
                <div style="display: flex; gap: 15px; margin-bottom: 15px;">
                    <label style="color:#fff; cursor:pointer;"><input type="radio" name="time-mode" value="real" checked onchange="updateSimMode()"> 🕒 Real Time</label>
                    <label style="color:#fff; cursor:pointer;"><input type="radio" name="time-mode" value="sim" onchange="updateSimMode()"> 🧪 Simulate</label>
                </div>
                <input type="time" id="sim-time-input" value="13:54" onchange="updateSimMode()">
                <div class="status-msg" id="sim-status" style="color:#E43138;"></div>
            </div>

            <div class="api-panel">
                <div class="api-panel-header" onclick="toggleApiPanel()">
                    <div class="api-title">
                        <span class="api-status-dot" id="api-dot"></span>
                        APPS SCRIPT API CONNECTION
                    </div>
                    <span style="color: #8a8a93; font-size: 0.8rem;">⚙️ EDIT</span>
                </div>
                <div class="api-content" id="api-content">
                    <p style="font-size: 0.8rem; margin-bottom: 10px;">วางลิงก์ Web App URL ที่สร้างจาก Apps Script</p>
                    <input type="text" id="script-url" placeholder="https://script.google.com/macros/s/.../exec">
                    <button class="btn" style="background-color: #00e676; color: #000; padding: 8px; font-size: 0.85rem;" onclick="saveScriptUrl()">Save & Connect</button>
                    <div class="status-msg" id="setup-status"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const savedUrl = localStorage.getItem('apps_script_url');
            if (savedUrl) {
                document.getElementById('script-url').value = savedUrl;
                document.getElementById('api-dot').classList.add('active');
            }
            renderHistory();
            loadSettings();
        });

        function toggleApiPanel() {
            document.getElementById('api-content').classList.toggle('open');
        }

        function saveScriptUrl() {
            const url = document.getElementById('script-url').value.trim();
            const status = document.getElementById('setup-status');
            const dot = document.getElementById('api-dot');
            
            if(!url) { 
                localStorage.removeItem('apps_script_url'); 
                dot.classList.remove('active');
                status.textContent = "Cleared API URL"; 
                status.style.color = "#ffcc00"; 
                return; 
            }
            localStorage.setItem('apps_script_url', url);
            dot.classList.add('active');
            status.textContent = "✔ API Connected!";
            status.style.color = "#00e676";
            setTimeout(() => toggleApiPanel(), 1500); // ปิดหน้าต่างออโต้หลังเซฟเสร็จ
        }

        function sendAnnouncement() {
            const text = document.getElementById('custom-note').value.trim();
            const scriptUrl = localStorage.getItem('apps_script_url');
            const status = document.getElementById('note-status');
            
            if(!scriptUrl) return alert("กรุณากดปุ่ม ⚙️ EDIT ด้านขวาล่างเพื่อตั้งค่าลิงก์ API ก่อนครับ!");
            if(!text) return alert("กรุณาพิมพ์ข้อความประกาศ");

            const now = new Date();
            const timeStr = String(now.getHours()).padStart(2, '0') + ":" + String(now.getMinutes()).padStart(2, '0');
            
            status.textContent = "Sending to Google Sheets...";
            status.style.color = "#ffcc00";

            fetch(scriptUrl, {
                method: "POST", mode: "no-cors", headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ action: "set_announcement", text: text, time: timeStr })
            }).then(() => {
                status.textContent = "✔ Broadcasted to Sheets!";
                status.style.color = "#00e676";
                
                let history = JSON.parse(localStorage.getItem('announcement_history') || "[]");
                history.unshift({ text: text, time: timeStr });
                localStorage.setItem('announcement_history', JSON.stringify(history));
                document.getElementById('custom-note').value = "";
                renderHistory();
            }).catch(err => {
                status.textContent = "❌ Error connecting to script";
                status.style.color = "#E43138";
            });
        }

        function clearAnnouncement() {
            const scriptUrl = localStorage.getItem('apps_script_url');
            const status = document.getElementById('note-status');
            if(!scriptUrl) return alert("กรุณาตั้งค่าลิงก์ API ก่อน");

            status.textContent = "Clearing Google Sheets...";
            fetch(scriptUrl, {
                method: "POST", mode: "no-cors", headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ action: "clear_announcement" })
            }).then(() => {
                status.textContent = "✔ Cleared Announcement.";
                status.style.color = "#ffcc00";
            });
        }

        function renderHistory() {
            const container = document.getElementById('history-container');
            const history = JSON.parse(localStorage.getItem('announcement_history') || "[]");
            container.innerHTML = history.length === 0 ? "<div style='color:#666; font-size:0.8rem;'>No history.</div>" : "";
            history.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = "history-item";
                div.innerHTML = `<div><span class="history-time">[${item.time}]</span> <span style="color:#fff">${item.text}</span></div>
                                 <button class="btn-reuse" onclick="document.getElementById('custom-note').value='${item.text.replace(/'/g, "\\'")}';">Reuse</button>`;
                container.appendChild(div);
            });
        }

        // --- Simulate Time Logic ---
        function loadSettings() {
            const mode = localStorage.getItem('sim_mode') || 'real';
            const time = localStorage.getItem('sim_time') || '13:54';
            document.querySelector(`input[name="time-mode"][value="${mode}"]`).checked = true;
            document.getElementById('sim-time-input').value = time;
        }

        function updateSimMode() {
            const mode = document.querySelector('input[name="time-mode"]:checked').value;
            const time = document.getElementById('sim-time-input').value;
            localStorage.setItem('sim_mode', mode);
            localStorage.setItem('sim_time', time);
            const statusBox = document.getElementById('sim-status');
            statusBox.textContent = mode === 'sim' ? `SIMULATING: ${time}` : "REAL TIME ACTIVE";
            if (mode !== 'sim') statusBox.style.color = "#a0a0ab";
        }
    </script>
</body>
</html>
