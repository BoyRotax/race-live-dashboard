<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Race Dashboard - Staff Admin Panel</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0c0c0e; color: #ffffff; padding: 30px; }
        
        /* TOP HEADER */
        .top-header { max-width: 1400px; margin: 0 auto 30px auto; display: flex; justify-content: space-between; align-items: center; background: #141418; padding: 20px 30px; border-radius: 8px; border: 1px solid #2e2e38; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .top-header h1 { color: #ffcc00; font-size: 1.8rem; margin: 0; text-transform: uppercase; letter-spacing: 1px; }
        
        /* GRID LAYOUT (3/4 Left, 1/4 Right) */
        .admin-layout { display: grid; grid-template-columns: 3fr 1fr; gap: 25px; max-width: 1400px; margin: 0 auto; align-items: start; }
        .left-col { display: flex; flex-direction: column; gap: 25px; }
        .right-col { display: flex; flex-direction: column; gap: 25px; }
        
        /* PANELS */
        .admin-box { background: #141418; border: 1px solid #2e2e38; border-radius: 8px; padding: 30px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .admin-box h2 { font-size: 1.4rem; margin-bottom: 15px; text-transform: uppercase; border-bottom: 2px solid; padding-bottom: 10px; }
        p { color: #a0a0ab; font-size: 0.95rem; margin-bottom: 20px; line-height: 1.5; }
        
        .input-group { margin-bottom: 20px; }
        label { display: block; color: #ffcc00; font-size: 0.85rem; font-weight: bold; text-transform: uppercase; margin-bottom: 8px; }
        input[type="text"], input[type="time"], textarea { width: 100%; background-color: #0a0a0c; border: 1px solid #444; color: #fff; padding: 12px; border-radius: 4px; font-size: 0.95rem; margin-bottom: 15px; font-family: inherit; resize: vertical; }
        
        .btn { background-color: #ffcc00; color: #000; border: none; padding: 12px 24px; border-radius: 4px; font-weight: bold; cursor: pointer; text-transform: uppercase; width: 100%; font-size: 1rem; transition: background 0.2s; }
        .btn:hover { background-color: #e6b800; }
        .btn-clear { background-color: #444; color: #fff; }
        .btn-clear:hover { background-color: #E43138; }
        .status-msg { margin-top: 15px; font-weight: bold; font-size: 0.9rem; text-align: center; min-height: 20px; }
        
        /* SPECIFIC BOX COLORS */
        .note-box { border-color: #2196f3; }
        .note-box h2 { color: #2196f3; border-bottom-color: #2196f3; }
        .note-box label { color: #2196f3; }
        .note-box .btn-primary { background-color: #2196f3; color: #fff; }
        .note-box .btn-primary:hover { background-color: #1976d2; }
        
        .setup-box { border-color: #00e676; }
        .setup-box h2 { color: #00e676; border-bottom-color: #00e676; }
        .setup-box label { color: #00e676; }
        .setup-box .btn-primary { background-color: #00e676; color: #000; }
        .setup-box .btn-primary:hover { background-color: #00c853; }
        
        .test-box { border-color: #E43138; }
        .test-box h2 { color: #E43138; border-bottom-color: #E43138; }
        .test-box label { color: #E43138; }
        .radio-group { display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px; background: #0a0a0c; padding: 15px; border: 1px solid #444; border-radius: 4px; }
        .radio-group label { color: #fff; margin: 0; cursor: pointer; }

        /* History List */
        .history-list { margin-top: 10px; background: #0a0a0c; border: 1px solid #333; border-radius: 4px; max-height: 400px; overflow-y: auto; padding: 10px; }
        .history-item { padding: 12px; border-bottom: 1px dashed #333; font-size: 0.95rem; display: flex; justify-content: space-between; align-items: flex-start; gap: 15px; }
        .history-item:last-child { border-bottom: none; }
        .history-time { color: #2196f3; font-weight: bold; min-width: 60px; }
        .history-text { color: #ccc; flex: 1; line-height: 1.4; }
        .btn-reuse { background: transparent; color: #ffcc00; border: 1px solid #ffcc00; padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 0.8rem; text-transform: uppercase; font-weight: bold; }
        .btn-reuse:hover { background: #ffcc00; color: #000; }

        #auth-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: #0c0c0e; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; }
        .auth-card { background: #141418; padding: 40px; border-radius: 8px; text-align: center; border: 1px solid #2e2e38; max-width: 400px; }
    </style>
</head>
<body>

    <div id="auth-overlay">
        <div class="auth-card">
            <h2 style="color:#ffcc00; margin-bottom: 15px; text-transform: uppercase; border-bottom: 2px solid #ffcc00; padding-bottom:10px;">Staff Authentication</h2>
            <div style="display: flex; justify-content: center; margin-top: 20px;">
                <div id="g_id_onload" data-client_id="YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com" data-context="signin" data-ux_mode="popup" data-callback="handleCredentialResponse" data-auto_prompt="false"></div>
                <div class="g_id_signin" data-type="standard" data-shape="rounded" data-theme="dark" data-text="signin_with" data-size="large" data-logo_alignment="left"></div>
            </div>
            <div id="auth-error" style="color: #ff5252; margin-top: 15px; font-weight: bold; font-size: 0.9rem;"></div>
        </div>
    </div>

    <!-- TOP HEADER -->
    <div class="top-header">
        <h1>Race Control Admin</h1>
        <div style="font-size: 0.95rem; display: flex; align-items: center;">
            <span>Logged in as: <strong id="user-email" style="color:#00e676;">info@rotax-asia.com</strong></span>
            <button onclick="logout()" style="margin-left: 20px; background: transparent; color: #ff5252; border: 1px solid #ff5252; padding: 5px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; text-transform: uppercase;">Logout</button>
        </div>
    </div>

    <!-- MAIN GRID LAYOUT -->
    <div class="admin-layout">
        
        <!-- LEFT COLUMN (3/4 Width) -->
        <div class="left-col">
            <div class="admin-box note-box">
                <h2>📢 Track Announcement</h2>
                <p>Send an urgent message to the Dashboard. It will be <strong>forced to show immediately for 1 minute</strong>, and then repeat every 5 minutes.</p>
                
                <div class="input-group">
                    <label>Custom Announcement Note</label>
                    <textarea id="custom-note" rows="3" placeholder="E.g., All Junior MAX drivers please report to briefing room."></textarea>
                    
                    <div style="display: flex; gap: 15px;">
                        <button class="btn btn-primary" style="flex: 2;" onclick="saveAnnouncement()">🚀 Broadcast Now</button>
                        <button class="btn btn-clear" style="flex: 1;" onclick="clearAnnouncement()">✖ Stop Announcing</button>
                    </div>
                </div>
                <div class="status-msg" id="note-status"></div>

                <h3 style="color:#2196f3; font-size:1rem; margin-top:30px; border-bottom:1px solid #333; padding-bottom:10px;">Announcement History</h3>
                <div class="history-list" id="history-container"></div>
            </div>
        </div>

        <!-- RIGHT COLUMN (1/4 Width) -->
        <div class="right-col">
            
            <!-- LIVE SETUP PANEL -->
            <div class="admin-box setup-box">
                <h2>📡 Live Setup</h2>
                <div class="input-group">
                    <label>Google Sheets CSV URL</label>
                    <input type="text" id="sheet-url" placeholder="https://docs.google.com/.../pub?output=csv" style="font-size: 0.8rem;">
                    <button class="btn btn-primary" onclick="saveNewSource()">Broadcast Link</button>
                </div>
                <div class="status-msg" id="admin-status"></div>
            </div>

            <!-- SIMULATE TIME PANEL -->
            <div class="admin-box test-box">
                <h2>⚙️ Simulate Time</h2>
                <div class="radio-group">
                    <label><input type="radio" name="time-mode" value="real" checked onchange="updateSimMode()"> 🕒 Real Local Time</label>
                    <label><input type="radio" name="time-mode" value="sim" onchange="updateSimMode()"> 🧪 Simulate Time</label>
                </div>
                <div class="input-group">
                    <label>Set Simulated Time (HH:MM)</label>
                    <input type="time" id="sim-time-input" value="13:54" onchange="updateSimMode()">
                </div>
                <div class="status-msg" id="sim-status" style="color:#E43138;"></div>
            </div>

        </div>
    </div>

    <script>
        const ALLOWED_STAFF = ["info@rotax-asia.com", "staff1@gmail.com", "racecontrol@gmail.com"];
        setTimeout(bypassAuth, 500); 

        function bypassAuth() {
            document.getElementById('auth-overlay').style.display = 'none';
            document.getElementById('user-email').textContent = "info@rotax-asia.com";
            loadSettings();
            renderHistory();
        }
        
        function handleCredentialResponse(response) {}

        function loadSettings() {
            const savedUrl = localStorage.getItem('google_sheet_csv_url');
            if (savedUrl) document.getElementById('sheet-url').value = savedUrl;

            const mode = localStorage.getItem('sim_mode') || 'real';
            const time = localStorage.getItem('sim_time') || '13:54';
            document.querySelector(`input[name="time-mode"][value="${mode}"]`).checked = true;
            document.getElementById('sim-time-input').value = time;
        }

        function saveNewSource() {
            const url = document.getElementById('sheet-url').value.trim();
            const statusBox = document.getElementById('admin-status');
            if (!url) {
                localStorage.removeItem('google_sheet_csv_url');
                statusBox.textContent = "Cleared data source. Reverted to mock data.";
                statusBox.style.color = "#ffcc00";
                return;
            }
            localStorage.setItem('google_sheet_csv_url', url);
            statusBox.textContent = "✔ Broadcasted!";
            statusBox.style.color = "#00e676";
            setTimeout(() => { statusBox.textContent = ""; }, 3000);
        }

        function saveAnnouncement() {
            const noteText = document.getElementById('custom-note').value.trim();
            if (!noteText) return alert("Please enter an announcement text.");
            
            const now = new Date();
            const timeStr = String(now.getHours()).padStart(2, '0') + ":" + String(now.getMinutes()).padStart(2, '0');
            const payload = {
                text: noteText,
                time: timeStr,
                timestamp: Math.floor(Date.now() / 1000)
            };

            localStorage.setItem('custom_announcement', JSON.stringify(payload));
            
            let history = JSON.parse(localStorage.getItem('announcement_history') || "[]");
            history.unshift(payload); 
            if(history.length > 30) history.pop(); 
            localStorage.setItem('announcement_history', JSON.stringify(history));

            const statusBox = document.getElementById('note-status');
            statusBox.textContent = "✔ Broadcasted! Will display immediately for 1 min.";
            statusBox.style.color = "#00e676";
            setTimeout(() => { statusBox.textContent = ""; }, 4000);

            document.getElementById('custom-note').value = ""; 
            renderHistory();
        }

        function clearAnnouncement() {
            localStorage.removeItem('custom_announcement');
            const statusBox = document.getElementById('note-status');
            statusBox.textContent = "✔ Announcement stopped.";
            statusBox.style.color = "#ffcc00";
            setTimeout(() => { statusBox.textContent = ""; }, 4000);
        }

        function renderHistory() {
            const container = document.getElementById('history-container');
            const history = JSON.parse(localStorage.getItem('announcement_history') || "[]");
            container.innerHTML = "";
            if (history.length === 0) {
                container.innerHTML = "<div style='color:#666; font-size:0.9rem; padding: 10px;'>No history yet.</div>";
                return;
            }
            history.forEach(item => {
                const div = document.createElement('div');
                div.className = "history-item";
                div.innerHTML = `
                    <div style="display:flex; gap:10px; width: 100%;">
                        <span class="history-time">[${item.time}]</span>
                        <span class="history-text">${item.text}</span>
                    </div>
                    <button class="btn-reuse" onclick="reuseNote(this)" data-text="${item.text.replace(/"/g, '&quot;')}">Reuse</button>
                `;
                container.appendChild(div);
            });
        }

        function reuseNote(btn) {
            document.getElementById('custom-note').value = btn.getAttribute('data-text');
        }

        function updateSimMode() {
            const mode = document.querySelector('input[name="time-mode"]:checked').value;
            const time = document.getElementById('sim-time-input').value;
            localStorage.setItem('sim_mode', mode);
            localStorage.setItem('sim_time', time);
            const statusBox = document.getElementById('sim-status');
            statusBox.textContent = mode === 'sim' ? `SIMULATING: ${time}` : "REAL TIME ACTIVE";
            if (mode !== 'sim') statusBox.style.color = "#a0a0ab";
        }

        function logout() { location.reload(); }
    </script>
</body>
</html>
