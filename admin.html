<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Race Dashboard - Staff Admin Panel</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0c0c0e; color: #ffffff; padding: 30px; }
        
        .top-header { max-width: 1400px; margin: 0 auto 30px auto; display: flex; justify-content: space-between; align-items: center; background: #141418; padding: 20px 30px; border-radius: 8px; border: 1px solid #2e2e38; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .top-header h1 { color: #ffcc00; font-size: 1.8rem; margin: 0; text-transform: uppercase; letter-spacing: 1px; }
        
        .admin-layout { display: grid; grid-template-columns: 1fr; gap: 25px; max-width: 1400px; margin: 0 auto; align-items: start; }
        @media (min-width: 992px) { .admin-layout { grid-template-columns: 3fr 1fr; } }
        
        .admin-box { background: #141418; border: 1px solid #2e2e38; border-radius: 8px; padding: 30px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .admin-box h2 { font-size: 1.4rem; margin-bottom: 15px; text-transform: uppercase; border-bottom: 2px solid; padding-bottom: 10px; }
        p { color: #a0a0ab; font-size: 0.95rem; margin-bottom: 20px; line-height: 1.5; }
        
        .input-group { margin-bottom: 20px; }
        label { display: block; color: #ffcc00; font-size: 0.85rem; font-weight: bold; text-transform: uppercase; margin-bottom: 8px; }
        input[type="text"], input[type="time"], textarea { width: 100%; background-color: #0a0a0c; border: 1px solid #444; color: #fff; padding: 12px; border-radius: 4px; font-size: 0.95rem; margin-bottom: 15px; font-family: inherit; }
        
        .btn { background-color: #ffcc00; color: #000; border: none; padding: 12px 24px; border-radius: 4px; font-weight: bold; cursor: pointer; text-transform: uppercase; width: 100%; font-size: 1rem; transition: background 0.2s; }
        .btn:hover { background-color: #e6b800; }
        .btn-clear { background-color: #444; color: #fff; }
        .btn-clear:hover { background-color: #E43138; }
        .status-msg { margin-top: 15px; font-weight: bold; font-size: 0.9rem; text-align: center; min-height: 20px; }
        
        .note-box { border-color: #2196f3; }
        .note-box h2 { color: #2196f3; border-bottom-color: #2196f3; }
        
        .test-box { border-color: #E43138; }
        .test-box h2 { color: #E43138; border-bottom-color: #E43138; }
        
        .history-list { margin-top: 10px; background: #0a0a0c; border: 1px solid #333; border-radius: 4px; max-height: 300px; overflow-y: auto; padding: 10px; }
        .history-item { padding: 12px; border-bottom: 1px dashed #333; font-size: 0.95rem; display: flex; justify-content: space-between; align-items: center; }
        .history-item:last-child { border-bottom: none; }
        .history-time { color: #2196f3; font-weight: bold; }
        .btn-reuse { background: transparent; padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 0.8rem; text-transform: uppercase; font-weight: bold; color: #ffcc00; border: 1px solid #ffcc00; }
        .btn-reuse:hover { background: #ffcc00; color: #000; }

        /* Collapsible API Panel */
        .api-panel { background: #141418; border: 1px solid #2e2e38; border-radius: 8px; margin-top: 25px; overflow: hidden; transition: all 0.3s ease; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .api-panel-header { padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; background: #1a1a24; border-bottom: 1px solid #2e2e38; }
        .api-panel-header:hover { background: #22222a; }
        .api-title { font-size: 0.9rem; color: #8a8a93; font-weight: bold; text-transform: uppercase; display: flex; align-items: center; gap: 10px; }
        .api-status-dot { width: 10px; height: 10px; border-radius: 50%; background: #E43138; display: inline-block; }
        .api-status-dot.active { background: #00e676; box-shadow: 0 0 8px rgba(0,230,118,0.5); }
        .api-content { padding: 25px; display: none; }
        .api-content.open { display: block; }
    </style>
</head>
<body>

    <div id="auth-overlay" style="display:none;"></div>

    <div class="top-header">
        <h1>Race Control Admin</h1>
        <div style="font-size: 0.95rem; display: flex; align-items: center;">
            <span>Logged in as: <strong style="color:#00e676;">info@rotax-asia.com</strong></span>
            <button onclick="logout()" style="margin-left: 20px; background: transparent; color: #ff5252; border: 1px solid #ff5252; padding: 5px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; text-transform: uppercase;">Logout</button>
        </div>
    </div>

    <div class="admin-layout">
        <div class="left-col">
            <div class="admin-box note-box">
                <h2>📢 Track Announcement</h2>
                <p>พิมพ์ประกาศเพื่อบันทึกลงชีต <strong>"Announcements"</strong> และส่งไปยังหน้าจอมือถือของทุกคนแบบ Real-time</p>
                <div class="input-group">
                    <label style="color:#2196f3;">Custom Announcement Note</label>
                    <textarea id="custom-note" rows="3" placeholder="พิมพ์ข้อความที่นี่..."></textarea>
                    <div style="display: flex; gap: 15px;">
                        <button class="btn" style="background-color: #2196f3; color: #fff; flex: 2;" onclick="sendAnnouncement()">🚀 Broadcast to Sheet</button>
                        <button class="btn btn-clear" style="flex: 1;" onclick="clearAnnouncement()">✖ Stop / Clear Sheet</button>
                    </div>
                </div>
                <div class="status-msg" id="note-status"></div>
                <h3 style="color:#2196f3; font-size:1rem; margin-top:30px; border-bottom:1px solid #333; padding-bottom:10px;">History (Local Device)</h3>
                <div class="history-list" id="history-container"></div>
            </div>
        </div>

        <div class="right-col">
            <div class="admin-box test-box">
                <h2>⚙️ Simulate Time</h2>
                <div style="display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px; background: #0a0a0c; padding: 15px; border: 1px solid #444; border-radius: 4px;">
                    <label style="color:#fff; cursor:pointer;"><input type="radio" name="time-mode" value="real" checked onchange="updateSimMode()"> 🕒 Real Local Time</label>
                    <label style="color:#fff; cursor:pointer;"><input type="radio" name="time-mode" value="sim" onchange="updateSimMode()"> 🧪 Simulate Time</label>
                </div>
                <div class="input-group">
                    <label>Set Simulated Time (HH:MM)</label>
                    <input type="time" id="sim-time-input" value="13:54" onchange="updateSimMode()">
                </div>
                <div class="status-msg" id="sim-status" style="color:#E43138;"></div>
            </div>

            <div class="api-panel">
                <div class="api-panel-header" onclick="toggleApiPanel()">
                    <div class="api-title">
                        <span class="api-status-dot" id="api-dot"></span>
                        ⚙️ API CONNECTION SETTINGS
                    </div>
                    <span style="color: #ffcc00; font-size: 0.85rem; font-weight: bold;">EDIT</span>
                </div>
                <div class="api-content" id="api-content">
                    <div class="input-group">
                        <label style="color:#00e676;">1. Google Sheets CSV URL</label>
                        <input type="text" id="sheet-url" placeholder="https://docs.google.com/spreadsheets/d/.../pub?output=csv">
                    </div>
                    <div class="input-group">
                        <label style="color:#2196f3;">2. Google Apps Script Web App URL</label>
                        <input type="text" id="script-url" placeholder="https://script.google.com/macros/s/.../exec">
                    </div>
                    <button class="btn" style="background-color: #00e676; color: #000;" onclick="saveAllApiSettings()">💾 Save & Connect All</button>
                    <div class="status-msg" id="setup-status"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            loadSettings();
            renderHistory();
        });

        function toggleApiPanel() {
            document.getElementById('api-content').classList.toggle('open');
        }

        function loadSettings() {
            const savedSheetUrl = localStorage.getItem('google_sheet_csv_url');
            if (savedSheetUrl) document.getElementById('sheet-url').value = savedSheetUrl;

            const savedScriptUrl = localStorage.getItem('apps_script_url');
            if (savedScriptUrl) document.getElementById('script-url').value = savedScriptUrl;

            if (savedSheetUrl || savedScriptUrl) {
                document.getElementById('api-dot').classList.add('active');
            }

            const mode = localStorage.getItem('sim_mode') || 'real';
            const time = localStorage.getItem('sim_time') || '13:54';
            document.querySelector(`input[name="time-mode"][value="${mode}"]`).checked = true;
            document.getElementById('sim-time-input').value = time;
        }

        function saveAllApiSettings() {
            const sheetUrl = document.getElementById('sheet-url').value.trim();
            const scriptUrl = document.getElementById('script-url').value.trim();
            const status = document.getElementById('setup-status');
            const dot = document.getElementById('api-dot');

            if (sheetUrl) localStorage.setItem('google_sheet_csv_url', sheetUrl);
            else localStorage.removeItem('google_sheet_csv_url');

            if (scriptUrl) localStorage.setItem('apps_script_url', scriptUrl);
            else localStorage.removeItem('apps_script_url');

            if (sheetUrl || scriptUrl) {
                dot.classList.add('active');
                status.textContent = "✔ Configuration Saved Successfully!";
                status.style.color = "#00e676";
            } else {
                dot.classList.remove('active');
                status.textContent = "Cleared all configurations.";
                status.style.color = "#ffcc00";
            }
            setTimeout(() => toggleApiPanel(), 1200); // Close panel after saving
        }

        function sendAnnouncement() {
            const text = document.getElementById('custom-note').value.trim();
            const scriptUrl = localStorage.getItem('apps_script_url');
            const status = document.getElementById('note-status');
            
            if(!scriptUrl) return alert("กรุณากดเปิดแถบ API CONNECTION SETTINGS ขวาล่าง เพื่อบันทึกค่าลิงก์ Apps Script ก่อนครับ!");
            if(!text) return alert("กรุณาพิมพ์ข้อความประกาศ");

            const now = new Date();
            const timeStr = String(now.getHours()).padStart(2, '0') + ":" + String(now.getMinutes()).padStart(2, '0');
            
            status.textContent = "Sending to Google Sheets...";
            status.style.color = "#ffcc00";

            fetch(scriptUrl, {
                method: "POST", mode: "no-cors", headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ action: "set_announcement", text: text, time: timeStr })
            }).then(() => {
                status.textContent = "✔ Broadcasted to Sheets!";
                status.style.color = "#00e676";
                
                let history = JSON.parse(localStorage.getItem('announcement_history') || "[]");
                history.unshift({ text: text, time: timeStr });
                localStorage.setItem('announcement_history', JSON.stringify(history));
                document.getElementById('custom-note').value = "";
                renderHistory();
            }).catch(err => {
                status.textContent = "❌ Error connecting to script";
                status.style.color = "#E43138";
            });
        }

        function clearAnnouncement() {
            const scriptUrl = localStorage.getItem('apps_script_url');
            const status = document.getElementById('note-status');
            if(!scriptUrl) return alert("กรุณาตั้งค่าลิงก์ API ก่อน");

            status.textContent = "Clearing Google Sheets...";
            fetch(scriptUrl, {
                method: "POST", mode: "no-cors", headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ action: "clear_announcement" })
            }).then(() => {
                status.textContent = "✔ Cleared Announcement.";
                status.style.color = "#ffcc00";
            });
        }

        function renderHistory() {
            const container = document.getElementById('history-container');
            const history = JSON.parse(localStorage.getItem('announcement_history') || "[]");
            container.innerHTML = history.length === 0 ? "<div style='color:#666; font-size:0.8rem;'>No history.</div>" : "";
            history.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = "history-item";
                div.innerHTML = `<div><span class="history-time">[${item.time}]</span> <span style="color:#fff">${item.text}</span></div>
                                 <button class="btn-reuse" onclick="document.getElementById('custom-note').value='${item.text.replace(/'/g, "\\'")}';">Reuse</button>`;
                container.appendChild(div);
            });
        }

        function logout() { location.reload(); }
    </script>
</body>
</html>
